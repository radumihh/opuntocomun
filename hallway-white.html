<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio de Arhitectură — Alb</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f4f2;
            font-family: 'Inter', sans-serif;
            color: #1c1c22;
            cursor: grab;
            user-select: none;
        }

        body:active {
            cursor: grabbing;
        }

        /* ============================================================
           TEXT
        ============================================================ */

        .hero-text {
            position: fixed;
            top: clamp(2rem, 6vh, 4.2rem);
            left: clamp(2rem, 6vw, 4.2rem);
            z-index: 20;
            pointer-events: none;
        }

        .hero-text .label {
            font-size: clamp(0.5rem, 0.65vw, 0.7rem);
            font-weight: 400;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(20,20,30,0.45);
            margin-bottom: 0.5rem;
        }

        .hero-text h1 {
            font-size: clamp(2.2rem, 5vw, 4.8rem);
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: #17171c;
            text-shadow: 0 2px 40px rgba(255,255,255,0.6);
        }

        .hero-text h1 span {
            display: block;
            font-weight: 300;
            color: rgba(20,20,30,0.4);
        }

        .hero-text .sub {
            margin-top: 0.7rem;
            font-size: clamp(0.6rem, 0.75vw, 0.8rem);
            font-weight: 300;
            letter-spacing: 0.07em;
            color: rgba(20,20,30,0.38);
        }

        /* ============================================================
           SCROLL INDICATOR
        ============================================================ */

        .scroll-indicator {
            position: fixed;
            bottom: clamp(2rem, 4vh, 3.2rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.35;
        }

        .scroll-indicator .line {
            width: 1px;
            height: 2.4rem;
            background: linear-gradient(
                to bottom,
                rgba(20,20,30,0.5),
                transparent
            );
            animation: scrollPulse 2.8s ease-in-out infinite;
        }

        .scroll-indicator .label {
            font-size: 0.45rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(20,20,30,0.4);
        }

        @keyframes scrollPulse {
            0%, 100% {
                transform: scaleY(0.2);
                opacity: 0.2;
            }

            50% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        .drag-hint {
            position: fixed;
            bottom: clamp(4.8rem, 9vh, 7.5rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 19;
            pointer-events: none;
            font-size: 0.4rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(20,20,30,0.18);
            opacity: 0;
            animation: fadeHint 5s ease 2.5s forwards;
        }

        @keyframes fadeHint {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(6px);
            }

            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ============================================================
           SCENA
        ============================================================ */

        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1200px;
            perspective-origin: 50% 42%;
            overflow: hidden;
            z-index: 1;
        }

        .world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .back-wall {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            transform: translateZ(-180px);

            background:
                radial-gradient(
                    ellipse at 50% 30%,
                    rgba(255,255,255,0.9) 0%,
                    rgba(235,235,232,0.85) 70%,
                    rgba(230,230,227,1) 100%
                );

            pointer-events: none;
        }

        .floor {
            position: absolute;
            bottom: -20%;
            left: -30%;
            width: 160%;
            height: 70%;
            transform:
                rotateX(-90deg)
                translateZ(-10px)
                scale(1.2);

            transform-origin: center bottom;

            background:
                radial-gradient(
                    ellipse at 50% 80%,
                    rgba(255,255,255,0.65) 0%,
                    rgba(240,240,237,0.5) 60%,
                    transparent 100%
                );

            border-radius: 50%;
            pointer-events: none;
        }

        /* ============================================================
           POSTER
        ============================================================ */

        .poster {
            position: absolute;

            top: 50%;
            left: 50%;

            transform-style: preserve-3d;
            will-change: transform;

            width: 180px;
            height: 240px;

            overflow: hidden;

            border-radius: 3px;

            box-shadow:
                0 18px 50px rgba(30,30,40,0.16),
                0 4px 16px rgba(30,30,40,0.10);

            border: 1px solid rgba(20,20,30,0.05);
        }

        /*
         * Umbra de contact — o pată subtilă pe podea chiar sub
         * poster, care ancorează imaginea și face reflexia să pară
         * mult mai naturală pe fundalul alb.
         */
        .contact-shadow {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 180px;
            height: 26px;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    ellipse at 50% 50%,
                    rgba(20,20,30,0.18) 0%,
                    rgba(20,20,30,0.08) 55%,
                    transparent 80%
                );

            filter: blur(3px);

            pointer-events: none;

            z-index: 1;
        }

        .poster-image {
            display: block;

            width: 220px;
            height: 293px;

            object-fit: cover;

            will-change: transform;

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(1.4);

            filter:
                brightness(1.02)
                saturate(0.98)
                contrast(1.0);

            border-radius: 0;
        }

        .poster-frame {
            position: absolute;
            inset: 0;

            border-radius: 3px;

            pointer-events: none;

            border: 1px solid rgba(255,255,255,0.6);

            box-shadow:
                inset 0 0 30px rgba(0,0,0,0.06);

            z-index: 2;
        }

        /* ============================================================
           REFLECTION
        ============================================================ */

        .reflection-wrapper {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 180px;
            height: 132px;

            transform-style: preserve-3d;

            transform-origin: 50% 0%;

            will-change: transform;

            pointer-events: none;
        }

        .reflection-inner {
            position: absolute;

            inset: 0;

            overflow: hidden;

            border-radius: 3px;

            -webkit-mask-image:
                var(--refl-mask);

            mask-image:
                var(--refl-mask);
        }

        /*
         * O linie/subtileț de podea lucioasă chiar la baza reflexiei,
         * care separă vizual imaginea de reflectarea ei.
         */
        .reflection-edge {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 2px;

            background: linear-gradient(
                to right,
                transparent,
                rgba(255,255,255,0.9) 30%,
                rgba(255,255,255,0.9) 70%,
                transparent
            );

            opacity: 0.6;

            pointer-events: none;

            z-index: 4;
        }

        .reflection-image {
            display: block;

            width: 220px;
            height: 293px;

            object-fit: cover;

            position: absolute;

            top: 50%;
            left: 50%;

            will-change: transform;

            transform:
                translate(-50%, -50%)
                scaleY(-1)
                scale(1.4);

            border-radius: 0;

            /*
             * Filtrele reale sunt aplicate din JavaScript.
             */
        }

        .reflection-caustic {
            position: absolute;

            inset: 0;

            border-radius: 3px;

            pointer-events: none;

            z-index: 3;

            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(255,255,255,0.06) 0%,
                    transparent 70%
                );

            mix-blend-mode: screen;
        }

        /* ============================================================
           CONTAINER
        ============================================================ */

        .posters-container {
            position: absolute;

            top: 20vh;
            left: 0;

            width: 100%;
            height: 100%;

            transform-style: preserve-3d;

            will-change: transform;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */

        @media (max-width: 768px) {

            .poster,
            .reflection-wrapper {
                width: 140px;
            }

            .poster {
                height: 187px;
            }

            .reflection-wrapper {
                height: 103px;
            }

            .poster-image,
            .reflection-image {
                width: 170px;
                height: 227px;
            }

            .scene {
                perspective: 800px;
            }

            .hero-text h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {

            .poster,
            .reflection-wrapper {
                width: 110px;
            }

            .poster {
                height: 147px;
            }

            .reflection-wrapper {
                height: 81px;
            }

            .poster-image,
            .reflection-image {
                width: 140px;
                height: 187px;
            }

            .scene {
                perspective: 600px;
            }

            .hero-text h1 {
                font-size: 1.5rem;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <!-- ============================================================
         TEXT
    ============================================================ -->

    <div class="hero-text">

        <div class="label">
            ● Studio de Arhitectură
        </div>

        <h1>
            Spațiu &amp; Lumină
            <span>în esență</span>
        </h1>

        <div class="sub">
            — arhitectura ca experiență
        </div>

    </div>


    <!-- ============================================================
         SCROLL
    ============================================================ -->

    <div class="scroll-indicator">

        <span class="label">
            Derulează
        </span>

        <div class="line"></div>

    </div>

    <div class="drag-hint">
        trage pentru a naviga
    </div>


    <!-- ============================================================
         SCENE
    ============================================================ -->

    <div class="scene" id="scene">

        <div class="world" id="world">

            <div class="back-wall"></div>

            <div class="floor"></div>

            <div
                class="posters-container"
                id="postersContainer"
            ></div>

        </div>

    </div>


    <script>

        /* ============================================================
           CONFIG
        ============================================================ */

        /*
         * Câte o imagine din FIECARE subfolder din
         * ./arch/ARCH DESIGN.
         */
        const IMAGES = [
            'A frame/1_edit.webp',
            'Apartament Baneasa/image00002.webp',
            'Apartament L1/1.webp',
            'Apartament Matei Basarab/01.webp',
            'Cabin in the woods/1_edit.webp',
            'Casa M1/imageye___-_imgi_12_715630_c128b5a7db134eaeb38a0ebf7def6dbb~mv2.webp',
            'Casa Mitza Berceni/01.webp',
            'Casa Oltean/01.webp',
            'Casa Roman Cluj/1.webp',
            'Casa Tartasesti/01.webp',
            'Courtyard House/1.webp',
            'DM House/living_1.webp',
            'FD House/1.1.webp',
            'Greenpoint/b1.webp',
            'GT Lawyer_s Office/1.webp',
            'IRINA TUDORACHE/p1.webp',
            'Marmura/01.webp',
            'Marmura Apartment/imageye___-_imgi_16_715630_62deaf56cce84a8993af85ee6783af63~mv2.webp',
            'PLUGUSOR/ppl1.webp',
            'Pool House 1/1.webp',
            'Residential/1.1.webp'
        ];

        const CARD_W = 180;
        const CARD_H = 240;

        const HALF_W = CARD_W / 2;
        const HALF_H = CARD_H / 2;

        const STEP = CARD_W + 70;


        /*
         * Posterul.
         */
        const POSTER_Y = -150;


        /*
         * Muchia de jos a posterului (folosită la centrare).
         */
        const POSTER_BOTTOM =
            POSTER_Y + HALF_H;


        const container =
            document.getElementById(
                'postersContainer'
            );


        function getCameraZ() {
            return 1200;
        }


        /* ============================================================
           GENERARE
        ============================================================ */

        const items = [];


        IMAGES.forEach((seed, index) => {

            const xPos =
                index * STEP;


            /* --------------------------------------------------------
               POSTER
            -------------------------------------------------------- */

            const posterEl =
                document.createElement('div');

            posterEl.className =
                'poster';

            posterEl.dataset.index =
                index;


            posterEl.style.transform =
                `translate3d(
                    calc(${xPos}px - 50%),
                    calc(${POSTER_Y}px - 50%),
                    0px
                )`;


            const img =
                document.createElement('img');

            img.className =
                'poster-image';

            img.src =
                `./arch/ARCH DESIGN/${seed}`;

            img.loading =
                'lazy';

            img.alt =
                `Arhitectură ${index + 1}`;


            const frame =
                document.createElement('div');

            frame.className =
                'poster-frame';


            posterEl.appendChild(img);

            posterEl.appendChild(frame);

            container.appendChild(
                posterEl
            );


            /* --------------------------------------------------------
               CONTACT SHADOW (sub poster, pe podea)
            -------------------------------------------------------- */

            const shadowEl =
                document.createElement('div');

            shadowEl.className =
                'contact-shadow';

            shadowEl.dataset.index =
                index;

            container.appendChild(
                shadowEl
            );


            /* --------------------------------------------------------
               REFLECTION
            -------------------------------------------------------- */

            const wrapEl =
                document.createElement('div');

            wrapEl.className =
                'reflection-wrapper';

            wrapEl.dataset.index =
                index;


            const innerEl =
                document.createElement('div');

            innerEl.className =
                'reflection-inner';


            const reflImg =
                document.createElement('img');

            reflImg.className =
                'reflection-image';

            reflImg.src =
                `./arch/ARCH DESIGN/${seed}`;

            reflImg.loading =
                'lazy';

            reflImg.alt =
                `Reflexie ${index + 1}`;


            const caustic =
                document.createElement('div');

            caustic.className =
                'reflection-caustic';


            const edgeEl =
                document.createElement('div');

            edgeEl.className =
                'reflection-edge';


            innerEl.appendChild(
                reflImg
            );

            innerEl.appendChild(
                caustic
            );

            wrapEl.appendChild(
                innerEl
            );

            wrapEl.appendChild(
                edgeEl
            );

            container.appendChild(
                wrapEl
            );


            items.push({

                poster: posterEl,

                img,

                shadowEl,

                wrapEl,

                innerEl,

                reflImg,

                edgeEl,

                x: xPos,

                index

            });

        });


        /* ============================================================
           CENTRARE
        ============================================================ */

        const totalW =
            (IMAGES.length - 1) * STEP;

        const centerOff =
            totalW / 2;


        container.style.transform =
            `translate3d(
                ${-centerOff}px,
                0px,
                0px
            )`;


        let currentX =
            -centerOff;

        let targetX =
            currentX;

        let velocity = 0;

        let isDragging =
            false;

        let dragStartX = 0;

        let dragStartScroll = 0;

        let lastPointerX = 0;

        let lastMoveTime = 0;


        /* ============================================================
           LIMITS
        ============================================================ */

        function getLimits() {

            const w =
                IMAGES.length * STEP;

            const vw =
                window.innerWidth;


            return {

                min:
                    -(w - vw * 0.3),

                max:
                    vw * 0.25

            };

        }


        function clampScroll(val) {

            const {
                min,
                max
            } = getLimits();


            return Math.max(
                min,
                Math.min(max, val)
            );

        }


        /* ============================================================
           UPDATE SCENE
        ============================================================ */

        function updateScene(scrollX) {

            const time =
                Date.now();

            const vw =
                window.innerWidth;

            const vh =
                window.innerHeight;


            const viewCenterX =
                vw / 2;


            const cameraZ =
                getCameraZ();


            items.forEach((item) => {


                /* ====================================================
                   POZIȚIE CARD
                ==================================================== */

                const worldX =
                    item.x +
                    scrollX +
                    viewCenterX;


                const normDist =
                    (worldX - viewCenterX) /
                    (vw * 0.5);


                const dist =
                    Math.max(
                        -1.4,
                        Math.min(
                            1.4,
                            normDist
                        )
                    );


                const reflectionDist =
                    Math.max(
                        -1,
                        Math.min(
                            1,
                            dist
                        )
                    );


                const absDist =
                    Math.abs(
                        reflectionDist
                    );


                /* ====================================================
                   POSTER
                ==================================================== */

                const floatY =
                    Math.sin(
                        time / 1800 +
                        item.index * 1.3
                    ) * 1.8;


                const parallaxX =
                    dist * 22;


                const parallaxY =
                    Math.sin(
                        dist * 1.5
                    ) * 7;


                const zOff =
                    Math.sin(
                        dist * 1.2
                    ) * 16;


                item.poster.style.transform =
                    `translate3d(
                        calc(${item.x}px - 50%),
                        calc(${POSTER_Y + floatY}px - 50%),
                        ${zOff}px
                    )`;


                item.img.style.transform =
                    `translate(
                        calc(-50% + ${parallaxX}px),
                        calc(-50% + ${parallaxY}px)
                    )
                    scale(1.4)`;


                /*
                 * ====================================================
                 * CONTACT SHADOW
                 *
                 * Stă chiar sub muchia de jos a posterului, pe podea,
                 * ca o umbră de ancorare. Follow-ește poziția X
                 * a posterului.
                 * ====================================================
                 */

                const shadowY =
                    POSTER_Y + HALF_H - 4;

                item.shadowEl.style.transform =
                    `translate3d(
                        calc(${item.x}px - 50%),
                        calc(${shadowY}px - 50%),
                        ${zOff - 6}px
                    )`;

                const shadowOpacity =
                    Math.max(
                        0.25,
                        0.55 -
                        absDist * 0.20
                    );

                item.shadowEl.style.opacity =
                    shadowOpacity;


                /* ====================================================
                   REFLECTION
                ==================================================== */

                const floatYRefl =
                    Math.sin(
                        time / 1900 +
                        item.index * 1.4 +
                        0.5
                    ) * 1.2;


                /*
                 * ROTATE X.
                 *
                 * CENTRU = 26°
                 * EXTREMITĂȚI = 4°
                 */

                const rotX =
                    4 +
                    22 *
                    (1 - absDist);


                /*
                 * SKEW X.
                 *
                 * LEFT  = +12
                 * CENTER = 0
                 * RIGHT = -12
                 */

                const skewX =
                    -reflectionDist * 12;


                const reflectionX =
                    item.x;


                /* ====================================================
                   REFLECTION Y (ROBUST)
                ==================================================== */

                const posterCssH =
                    item.poster.offsetHeight;

                const posterH_screen =
                    item.poster.getBoundingClientRect().height;

                const gapScreen = 14;

                const reflectionY =
                    (
                        posterH_screen + gapScreen
                    ) *
                    (posterCssH / posterH_screen) +
                    POSTER_Y +
                    floatYRefl;


                /*
                 * ADÂNCIME
                 */

                const reflZ =
                    -10 -
                    absDist * 6;


                /*
                 * OPACITY
                 *
                 * Pe fundal alb, reflexia trebuie să fie ușor mai
                 * prezentă ca să fie vizibilă, dar totuși delicată.
                 */

                const opacity =
                    Math.max(
                        0.34,
                        0.82 -
                        absDist * 0.22
                    );


                /*
                 * BLUR / SATURATION / BRIGHTNESS
                 */

                const blurPx =
                    0.12 +
                    absDist * 0.45;


                const saturate =
                    Math.max(
                        0.55,
                        0.80 -
                        absDist * 0.12
                    );


                const bright =
                    Math.max(
                        0.50,
                        0.66 -
                        absDist * 0.07
                    );


                /*
                 * MASK — disipare NONLINIARĂ, graduală.
                 *
                 * Reflexia rămâne aproape completă lângă poster,
                 * apoi se estompează LENT și într-o curbă lină
                 * (nu liniar), imitând modul în care o reflexie
                 * reală se pierde în podea.
                 *
                 * Folosim mai multe stop-uri cu o cădere pătratică
                 * (1 - t)^2: aproape opac sus, apoi disipare tot
                 * mai rapidă spre capăt.
                 */

                /* poziția (0-1) la care începe disiparea vizibilă */
                const fadeStart =
                    Math.max(
                        0.22,
                        0.42 -
                        absDist * 0.08
                    );

                /* poziția (0-1) la care reflexia dispare complet */
                const fadeEnd =
                    Math.max(
                        0.90,
                        1.0 -
                        absDist * 0.05
                    );


                /*
                 * Construim 10 stop-uri cu o curbă nonliniară.
                 * t merge de la 0 (sus) la 1 (jos).
                 */
                const stops = [];
                const count = 10;

                for (
                    let n = 0;
                    n <= count;
                    n++
                ) {

                    const t =
                        n / count;

                    const pos =
                        fadeStart +
                        (fadeEnd - fadeStart) * t;

                    /*
                     * Opacitatea scade cu o curba (1 - t)^3:
                     * - rămâne aproape plină lângă poster;
                     * - apoi are o coadă LUNGĂ și LINĂ;
                     * - disiparea se accelerează doar spre capăt.
                     * Exact cum se pierde o reflexie reală în podea.
                     */
                    const a =
                        0.97 *
                        Math.pow(
                            1 - t,
                            3.0
                        );

                    stops.push(
                        `rgba(0,0,0,${a.toFixed(3)}) ${(pos * 100).toFixed(1)}%`
                    );

                }


                const maskGrad =
                    `linear-gradient(
                        to bottom,
                        ${stops.join(',\n                        ')}
                    )`;


                /*
                 * APPLY TRANSFORM
                 */

                item.wrapEl.style.transform =
                    `translate3d(
                        calc(${reflectionX}px - 50%),
                        calc(${reflectionY}px - 50%),
                        ${reflZ}px
                    )
                    rotateX(${rotX}deg)
                    skewX(${skewX}deg)`;


                item.wrapEl.style.opacity =
                    opacity;


                /*
                 * MASK
                 */

                item.innerEl.style.setProperty(
                    '--refl-mask',
                    maskGrad
                );

                item.innerEl.style.webkitMaskImage =
                    maskGrad;

                item.innerEl.style.maskImage =
                    maskGrad;


                /*
                 * REFLECTION IMAGE (parallax în oglindă)
                 *
                 * scaleY(-0.62) oglindește VERTICAL și totodată
                 * comprimă reflexia (foreshortening de podea),
                 * astfel încât reflexia să fie mai scurtă și mai
                 * mică decât poza — mult mai naturală pe fundal alb.
                 */

                item.reflImg.style.filter =
                    `brightness(${bright})
                     saturate(${saturate})
                     blur(${blurPx}px)`;


                item.reflImg.style.transform =
                    `translate(
                        calc(-50% + ${parallaxX}px),
                        calc(-50% - ${parallaxY}px)
                    )
                     scale(1.4)
                     scaleY(-0.62)`;

            });

        }


        /* ============================================================
           APPLY SCROLL
        ============================================================ */

        function applyScroll(x) {

            currentX =
                x;


            container.style.transform =
                `translate3d(
                    ${x}px,
                    0px,
                    0px
                )`;


            updateScene(x);

        }


        /* ============================================================
           INTERACTION
        ============================================================ */

        function onPointerDown(x) {

            isDragging =
                true;

            dragStartX =
                x;

            dragStartScroll =
                currentX;

            lastPointerX =
                x;

            lastMoveTime =
                performance.now();

            velocity =
                0;

            document.body.style.cursor =
                'grabbing';

        }


        function onPointerMove(x) {

            if (!isDragging)
                return;


            const delta =
                x -
                dragStartX;


            targetX =
                clampScroll(
                    dragStartScroll +
                    delta
                );


            applyScroll(
                targetX
            );


            const now =
                performance.now();


            const dt =
                now -
                lastMoveTime;


            if (dt > 0) {

                const dx =
                    x -
                    lastPointerX;


                velocity =
                    Math.max(
                        -500,
                        Math.min(
                            500,
                            dx / dt * 14
                        )
                    );

            }


            lastPointerX =
                x;

            lastMoveTime =
                now;

        }


        function onPointerUp() {

            if (!isDragging)
                return;


            isDragging =
                false;


            document.body.style.cursor =
                'grab';


            if (
                Math.abs(velocity) < 1
            ) {
                velocity = 0;
            }

        }


        /* ============================================================
           MOUSE
        ============================================================ */

        document.addEventListener(
            'mousedown',
            e => {

                if (
                    e.target.closest(
                        '.hero-text, .scroll-indicator, .drag-hint'
                    )
                ) {
                    return;
                }

                onPointerDown(
                    e.clientX
                );

            }
        );


        document.addEventListener(
            'mousemove',
            e => {

                onPointerMove(
                    e.clientX
                );

            }
        );


        document.addEventListener(
            'mouseup',
            onPointerUp
        );


        /* ============================================================
           TOUCH
        ============================================================ */

        document.addEventListener(
            'touchstart',
            e => {

                const t =
                    e.touches[0];

                if (
                    !t ||
                    e.target.closest(
                        '.hero-text, .scroll-indicator, .drag-hint'
                    )
                ) {
                    return;
                }

                onPointerDown(
                    t.clientX
                );

            },
            {
                passive: true
            }
        );


        document.addEventListener(
            'touchmove',
            e => {

                const t =
                    e.touches[0];

                if (t) {

                    onPointerMove(
                        t.clientX
                    );

                }

            },
            {
                passive: true
            }
        );


        document.addEventListener(
            'touchend',
            onPointerUp,
            {
                passive: true
            }
        );


        /* ============================================================
           WHEEL
        ============================================================ */

        document.addEventListener(
            'wheel',
            e => {

                if (
                    e.target.closest(
                        '.hero-text, .scroll-indicator, .drag-hint'
                    )
                ) {
                    return;
                }


                e.preventDefault();


                targetX =
                    clampScroll(
                        targetX -
                        e.deltaY * 0.7
                    );


                velocity =
                    0;

            },
            {
                passive: false
            }
        );


        /* ============================================================
           KEYBOARD
        ============================================================ */

        document.addEventListener(
            'keydown',
            e => {

                if (
                    e.key === 'ArrowLeft'
                ) {

                    e.preventDefault();

                    targetX =
                        clampScroll(
                            targetX +
                            STEP * 0.3
                        );

                    velocity =
                        0;

                }


                if (
                    e.key === 'ArrowRight'
                ) {

                    e.preventDefault();

                    targetX =
                        clampScroll(
                            targetX -
                            STEP * 0.3
                        );

                    velocity =
                        0;

                }

            }
        );


        /* ============================================================
           RESIZE
        ============================================================ */

        let resizeTimer;


        window.addEventListener(
            'resize',
            () => {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        () => {

                            targetX =
                                clampScroll(
                                    currentX
                                );

                            applyScroll(
                                targetX
                            );

                        },
                        100
                    );

            }
        );


        /* ============================================================
           ANIMATION LOOP
        ============================================================ */

        let rafId;


        function animate() {

            if (
                !isDragging &&
                Math.abs(velocity) > 0.3
            ) {

                targetX =
                    clampScroll(
                        targetX +
                        velocity * 0.02
                    );


                velocity *=
                    0.96;


                if (
                    Math.abs(velocity) < 0.3
                ) {

                    velocity =
                        0;

                }

            }


            const diff =
                targetX -
                currentX;


            if (
                Math.abs(diff) > 0.05
            ) {

                currentX +=
                    diff * 0.07;


                container.style.transform =
                    `translate3d(
                        ${currentX}px,
                        0px,
                        0px
                    )`;

            } else {

                currentX =
                    targetX;


                container.style.transform =
                    `translate3d(
                        ${currentX}px,
                        0px,
                        0px
                    )`;

            }


            updateScene(
                currentX
            );


            rafId =
                requestAnimationFrame(
                    animate
                );

        }


        /* ============================================================
           INIT
        ============================================================ */

        function init() {

            const total =
                (IMAGES.length - 1) *
                STEP;


            targetX =
                clampScroll(
                    -total / 2 + 20
                );


            currentX =
                targetX;


            container.style.transform =
                `translate3d(
                    ${currentX}px,
                    0px,
                    0px
                )`;


            updateScene(
                currentX
            );


            animate();


            setTimeout(
                () => {
                    updateScene(
                        currentX
                    );
                },
                200
            );

        }


        if (
            document.readyState ===
            'complete'
        ) {

            setTimeout(
                init,
                100
            );

        } else {

            window.addEventListener(
                'load',
                () => {
                    setTimeout(
                        init,
                        150
                    );
                }
            );

        }


        window.addEventListener(
            'beforeunload',
            () => {

                if (rafId) {

                    cancelAnimationFrame(
                        rafId
                    );

                }

            }
        );

    </script>

</body>
</html>
